name: Verileri güncelle

on:
  schedule:
    - cron: "23 */6 * * *"   # 6 saatte bir (UTC)
  workflow_dispatch:
    inputs:
      full:
        description: "Her şeyi zorla yenile (profiller, görseller, yetenekler)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veri-guncelleme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Her oyun ayrı güncellenir; biri başarısız olursa diğerleri yine güncellenir, eski veri korunur.
      - name: Wild Rift
        id: wr
        run: node wr/scripts/update.js ${{ inputs.full && '--full' || '' }} || echo "failed=1" >> "$GITHUB_OUTPUT"

      - name: League of Legends
        id: lol
        run: |
          if [ -f lol/scripts/update.js ]; then
            node lol/scripts/update.js ${{ inputs.full && '--full' || '' }} || echo "failed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: VALORANT
        id: val
        run: |
          if [ -f valorant/scripts/update.js ]; then
            node valorant/scripts/update.js ${{ inputs.full && '--full' || '' }} || echo "failed=1" >> "$GITHUB_OUTPUT"
          fi

      # Lineup'lar YouTube rehber videolarının bölümlerinden günde en fazla bir kez büyür (durum dosyasındaki
      # zamana bakar). YouTube engellerse veriye dokunmadan geçer; bu adımın hatası işi başarısız saymaz.
      - name: VALORANT lineup'ları
        continue-on-error: true
        run: |
          if [ -f valorant/scripts/lineups.js ]; then
            timeout 15m node valorant/scripts/lineups.js || echo "::warning::VALORANT lineup adımı tamamlanamadı; veri değişmedi."
          fi

      - name: Değişiklik varsa kaydet ve yayınla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in wr/data wr/img lol/data lol/img valorant/data valorant/img; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then
            echo "Veri değişmedi."
          else
            git commit -m "Veri güncellemesi ($(date -u +%F))"
            git pull --rebase -q && git push
          fi

      - name: Hata bildirimi
        if: steps.wr.outputs.failed == '1' || steps.lol.outputs.failed == '1' || steps.val.outputs.failed == '1'
        run: |
          echo "::error::Bazı veri adımları başarısız oldu (WR=${{ steps.wr.outputs.failed }} LoL=${{ steps.lol.outputs.failed }} VAL=${{ steps.val.outputs.failed }}); eski veriler korundu."
          exit 1
